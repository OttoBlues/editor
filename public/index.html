<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Editor</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6.5 3.5h7l4 4v13h-11z"/><path d="M13.5 3.5v4h4M9 12h6M9 15.5h6"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 6.5h6l2 2h9v10h-17z"/></symbol>
      <symbol id="i-workspace" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M10 4.5v15"/></symbol>
      <symbol id="i-plugins" viewBox="0 0 24 24"><path d="M8 3.5v4M16 3.5v4M6 7.5h12v3.8a6 6 0 0 1-5 5.9v3.3h-2v-3.3a6 6 0 0 1-5-5.9z"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="7"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 8a7.5 7.5 0 0 0-12.8-2L4 8.2M4 4.5v3.7h3.7M5 16a7.5 7.5 0 0 0 12.8 2l2.2-2.2M20 19.5v-3.7h-3.7"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-reference" viewBox="0 0 24 24"><path d="M9.5 14.5l5-5M8 16l-1 1a3.5 3.5 0 0 1-5-5l4-4a3.5 3.5 0 0 1 5 0M16 8l1-1a3.5 3.5 0 0 1 5 5l-4 4a3.5 3.5 0 0 1-5 0"/></symbol>
      <symbol id="i-attention" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.5"/></symbol>
      <symbol id="i-focus" viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7zM19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7z"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
      <symbol id="i-split" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M12 4.5v15"/></symbol>
    </svg>

    <div class="app-shell">
      <aside class="sidebar" data-i18n-aria="navigation">
        <div class="brand"><div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div><strong>Editor</strong></div>
        <nav class="main-nav" data-i18n-aria="navigation">
          <button type="button" class="nav-button active" data-view="workspace"><svg class="icon"><use href="#i-workspace"></use></svg><span data-i18n="workspace">工作空间</span></button>
          <button type="button" class="nav-button" data-view="plugins"><svg class="icon"><use href="#i-plugins"></use></svg><span data-i18n="plugins">插件</span></button>
          <button type="button" class="nav-button" data-view="settings"><svg class="icon"><use href="#i-settings"></use></svg><span data-i18n="settings">设置</span></button>
        </nav>
      </aside>

      <main class="main-area">
        <section id="workspace-view" class="workspace-layout" data-i18n-aria="editor">
          <section class="editors-section" data-i18n-aria="editor">
            <div id="panes" class="panes"><div id="pane-divider" class="pane-divider" role="separator" tabindex="0" aria-orientation="vertical" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50" data-i18n-aria="resize" hidden></div></div>
            <button id="split-toggle" class="layout-button" type="button" data-active="false" data-i18n-aria="openSplit"><svg class="icon"><use href="#i-split"></use></svg><span class="layout-label" data-i18n="split">分栏</span><span class="layout-dirty" hidden></span></button>
          </section>
          <aside class="assistant-panel" aria-labelledby="assistant-title">
            <div class="assistant-heading"><div class="spark-icon"><svg class="icon"><use href="#i-spark"></use></svg></div><div><h2 id="assistant-title" data-i18n="assistant">模拟助手</h2><p data-i18n="assistantInfo">基于规则 · 文件不上传</p></div></div>

            <section class="context-section">
              <h3 data-i18n="references">引用</h3>
              <div id="reference-list" class="context-list"></div>
            </section>
            <section class="context-section attention-section">
              <h3 data-i18n="attention">关注</h3>
              <div id="attention-list" class="context-list"></div>
            </section>
            <section class="context-section">
              <h3 data-i18n="focus">聚焦</h3>
              <div id="focus-list" class="context-list"></div>
            </section>

            <section class="context-section">
              <label class="field-label" for="assistant-prompt" data-i18n="request">修改要求</label>
              <p id="assistant-target" class="target-name"></p>
              <textarea id="assistant-prompt" class="prompt-input" maxlength="240"></textarea>
              <div class="quick-prompts"><button type="button" data-prompt-key="addTitle" data-i18n="addTitle">添加标题</button><button type="button" data-prompt-key="tidySpacing" data-i18n="tidySpacing">整理空行</button><button type="button" data-prompt-key="insertReference" data-i18n="insertReference">插入参考</button></div>
              <button id="generate" class="primary-button" type="button"><svg class="icon"><use href="#i-spark"></use></svg><span data-i18n="generate">生成建议</span><svg class="icon button-arrow"><use href="#i-arrow"></use></svg></button>
              <div id="suggestion" class="suggestion" hidden>
                <h3 class="suggestion-heading" data-i18n="suggestion">修改建议</h3>
                <p id="suggestion-description" class="suggestion-description" hidden></p>
                <div class="diff-legend"><span><i class="removed-key"></i><span data-i18n="removed">删除</span></span><span><i class="added-key"></i><span data-i18n="added">新增</span></span></div>
                <div id="diff" class="diff" data-i18n-aria="diff"></div>
                <button id="apply-suggestion" class="apply-button" type="button"><svg class="icon"><use href="#i-check"></use></svg><span data-i18n="apply">应用到编辑区</span></button>
                <p class="apply-note"></p>
              </div>
            </section>
          </aside>
        </section>

        <section id="plugins-view" class="page-view" hidden>
          <h1 data-i18n="plugins">插件</h1>
          <h2 class="page-subtitle" data-i18n="installedPlugins">已安装</h2>
          <div id="plugin-list" class="plugin-list"></div>
          <p class="page-note" data-i18n="pluginBoundary">演示仅包含内置插件，暂不支持安装外部插件。</p>
        </section>
        <section id="settings-view" class="page-view" hidden>
          <h1 data-i18n="settings">设置</h1>
          <div class="setting-row"><label for="language-select" data-i18n="language">语言</label><select id="language-select"><option value="zh-CN">简体中文</option><option value="en">English</option></select></div>
          <fieldset class="setting-row color-setting"><legend data-i18n="themeColor">主题颜色</legend><div class="color-options"><label><input type="radio" name="accent" value="purple"><span class="color-swatch purple"></span><span data-i18n="purple">紫色</span></label><label><input type="radio" name="accent" value="blue"><span class="color-swatch blue"></span><span data-i18n="blue">蓝色</span></label><label><input type="radio" name="accent" value="green"><span class="color-swatch green"></span><span data-i18n="green">绿色</span></label></div></fieldset>
        </section>
      </main>
    </div>

    <template id="pane-template">
      <section class="editor-pane" tabindex="0">
        <div class="tabbar">
          <div class="tab-list" role="tablist"><button type="button" class="new-tab icon-button" data-i18n-aria="newTab" data-i18n-title="newTab"><svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg></button></div><span class="pane-loading" data-i18n="loading" hidden>正在打开…</span><span class="pane-indicator" aria-hidden="true" hidden></span>
        </div>
        <div class="pane-toolbar">
          <div class="mode-switch"><button type="button" class="edit-mode" data-i18n="edit">编辑</button><button type="button" class="preview-mode" data-i18n="preview">预览</button></div>
          <div class="context-actions" role="group" data-i18n-aria="contextActions">
            <button type="button" class="icon-button context-action" data-context="reference" data-i18n-aria="addReference" data-i18n-title="addReference"><svg class="icon" aria-hidden="true"><use href="#i-reference"></use></svg></button>
            <button type="button" class="icon-button context-action" data-context="attention" data-i18n-aria="addAttention" data-i18n-title="addAttention"><svg class="icon" aria-hidden="true"><use href="#i-attention"></use></svg></button>
          </div>
          <span class="file-meta"></span><button type="button" class="save-button" data-i18n="save">保存</button>
        </div>
        <div class="pane-warning" hidden></div>
        <div class="pane-body" role="tabpanel">
          <div class="empty-pane">
            <button class="drop-open" type="button"><svg class="icon" aria-hidden="true"><use href="#i-file"></use></svg><span data-i18n="emptyPane">将文件拖入此区域进行编辑</span><small data-i18n="chooseLocalFile">或点击选择 .md / .txt 文件</small></button>
            <input class="local-file-input" type="file" accept=".md,.txt" multiple hidden>
            <details class="sample-files"><summary data-i18n="sampleFiles">演示目录中的文件</summary><div class="file-menu-heading"><span data-i18n="files">文件</span><button class="icon-button refresh-files" type="button" data-i18n-aria="refreshFiles" data-i18n-title="refreshFiles"><svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg></button></div><div class="file-list" data-i18n-aria="files"></div></details>
          </div>
          <div class="editor-input-wrap" hidden><textarea class="editor-input" spellcheck="false" wrap="soft"></textarea></div><div class="markdown-preview" hidden></div>
        </div>
        <div class="pane-footer"><span class="pane-state"></span><span class="pane-stats"></span></div>
      </section>
    </template>
    <div id="focus-picker" class="focus-picker" role="dialog" data-i18n-aria="addFocus" hidden>
      <div class="focus-controls">
        <label for="focus-source" data-i18n="focusSource">来源</label><select id="focus-source"></select>
        <label for="focus-block" data-i18n="focusBlock">区块</label><select id="focus-block"></select>
        <label for="focus-role" data-i18n="focusRole">用途</label><select id="focus-role"><option value="target" data-i18n="targetRole">修改目标</option><option value="reference" data-i18n="referenceRole">参考片段</option></select>
      </div>
      <div class="focus-picker-footer"><div id="focus-pages" class="focus-pages" hidden><button id="focus-previous" type="button" class="text-button" data-i18n="previousPage">上一页</button><span id="focus-page"></span><button id="focus-next" type="button" class="text-button" data-i18n="nextPage">下一页</button></div><button id="set-focus" type="button" class="icon-button" data-i18n-aria="addFocus" data-i18n-title="addFocus"><svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg></button></div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
