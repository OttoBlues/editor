<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>笺 · 本地编辑器演示</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6.5 3.5h7l4 4v13h-11z"/><path d="M13.5 3.5v4h4M9 12h6M9 15.5h6"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 8a7.5 7.5 0 0 0-12.8-2L4 8.2M4 4.5v3.7h3.7M5 16a7.5 7.5 0 0 0 12.8 2l2.2-2.2M20 19.5v-3.7h-3.7"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7zM19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7z"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
      <symbol id="i-split" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M12 4.5v15"/></symbol>
    </svg>

    <div class="app-shell">
      <aside class="sidebar" aria-label="文件导航">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          <strong>笺</strong>
          <span class="brand-edition">演示</span>
        </div>
        <div class="file-heading"><span>文件</span><button class="icon-button" id="refresh-files" type="button" title="刷新文件列表" aria-label="刷新文件列表"><svg class="icon"><use href="#i-refresh"></use></svg></button></div>
        <div id="file-list" class="file-list" aria-label="文件列表"></div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <h1>工作空间</h1>
          <div class="topbar-actions">
            <button id="split-toggle" class="layout-button" type="button" data-active="false" aria-label="打开分栏"><svg class="icon"><use href="#i-split"></use></svg><span class="layout-label">分栏</span><span class="layout-dirty" title="隐藏的编辑区有未保存的更改" hidden></span></button>
            <span class="connection"><span></span>本地运行</span>
          </div>
        </header>
        <div class="content-area">
          <div class="workspace-layout">
            <section class="editors-section" aria-label="编辑工作区">
              <div id="panes" class="panes"></div>
            </section>

            <aside class="assistant-panel" aria-labelledby="assistant-title">
              <div class="assistant-heading"><div class="spark-icon"><svg class="icon"><use href="#i-spark"></use></svg></div><div><h2 id="assistant-title">模拟助手</h2><p>基于规则 · 文件不上传</p></div></div>
              <div class="assistant-target"><span class="target-label">当前编辑区</span><span id="assistant-target" class="target-name">尚未选择文件</span></div>
              <label class="field-label" for="assistant-prompt">修改要求</label>
              <textarea id="assistant-prompt" class="prompt-input" maxlength="240"></textarea>
              <div class="quick-prompts"><button type="button" data-prompt="添加标题">添加标题</button><button type="button" data-prompt="整理多余空行">整理空行</button></div>
              <button id="generate" class="primary-button" type="button"><svg class="icon"><use href="#i-spark"></use></svg><span>生成建议</span><svg class="icon button-arrow"><use href="#i-arrow"></use></svg></button>
              <div id="suggestion" class="suggestion" hidden>
                <h3 class="suggestion-heading">修改建议</h3>
                <p id="suggestion-description" class="suggestion-description" hidden></p>
                <div class="diff-legend"><span><i class="removed-key"></i>删除</span><span><i class="added-key"></i>新增</span></div>
                <div id="diff" class="diff" aria-label="修改前后差异"></div>
                <button id="apply-suggestion" class="apply-button" type="button"><svg class="icon"><use href="#i-check"></use></svg>应用到编辑区</button>
                <p class="apply-note">应用后不会自动保存。</p>
              </div>
            </aside>
          </div>
        </div>
      </main>
    </div>

    <template id="pane-template">
      <section class="editor-pane" tabindex="0">
        <div class="tabbar"><div class="tab-list" role="tablist"></div><span class="pane-loading" hidden>正在打开…</span><span class="pane-indicator" aria-hidden="true" hidden></span></div>
        <div class="pane-toolbar">
          <div class="mode-switch"><button type="button" class="edit-mode">编辑</button><button type="button" class="preview-mode">预览</button></div>
          <span class="file-meta"></span>
          <button type="button" class="save-button">保存</button>
        </div>
        <div class="pane-warning" hidden></div>
        <div class="pane-body" role="tabpanel"><div class="empty-pane"><svg class="icon"><use href="#i-file"></use></svg><span>从文件列表打开</span></div><div class="editor-input-wrap" hidden><textarea class="editor-input" spellcheck="false" wrap="soft" aria-label="文件内容"></textarea></div><div class="markdown-preview" hidden></div></div>
        <div class="pane-footer"><span class="pane-state"></span><span class="pane-stats"></span></div>
      </section>
    </template>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
